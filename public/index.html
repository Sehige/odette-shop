<!DOCTYPE html>
<html lang="ro">
  <head>
    <!-- GTM is loaded dynamically via React after cookie consent -->

    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg?v=2" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo_swan.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e3a8a" />

    <!-- Google Fonts: Parisienne (script hero tagline) + Playfair Display (headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Playfair+Display:wght@500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Primary meta. Description and canonical are set per page by react-helmet-async
         (src/components/SEO/MetaTags.jsx): static copies here would sit next to them on
         every route and point every page at the homepage. -->
    <title>Odette Confiserie – Cofetărie artizanală în Cluj-Napoca</title>
    <meta name="author" content="Odette Confiserie" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Twitter defaults: link-preview bots (WhatsApp, Facebook) don't run
         JavaScript, so these static values are what they show. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.odette-confiserie.ro/" />
    <meta property="og:title" content="Odette Confiserie - Prăjituri Artizanale și Torturi Premium" />
    <meta property="og:description" content="Comandă online prăjituri artizanale, torturi personalizate și deserturi premium. Livrare în Cluj-Napoca." />
    <meta property="og:image" content="https://www.odette-confiserie.ro/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tarte artizanale cu ciocolată și alune pe o tavă de argint – Odette Confiserie" />
    <meta property="og:locale" content="ro_RO" />
    <meta property="og:site_name" content="Odette Confiserie" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Odette Confiserie - Prăjituri Artizanale și Torturi Premium" />
    <meta name="twitter:description" content="Comandă online prăjituri artizanale, torturi personalizate și deserturi premium." />
    <meta name="twitter:image" content="https://www.odette-confiserie.ro/og-image.jpg" />

    <!-- Geo Tags -->
    <meta name="geo.region" content="RO-CJ" />
    <meta name="geo.placename" content="Cluj-Napoca" />
    <meta name="geo.position" content="46.752273185339014; 23.56535278292503" />
    <meta name="ICBM" content="46.752273185339014, 23.56535278292503" />

    <!-- Business Info -->
    <meta name="contact" content="odette.confiserie@gmail.com" />
    <meta name="language" content="Romanian" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon-192x192.png" />
    <!-- Manifest loaded after page to avoid blocking critical path -->

    <!-- Preconnect to Cloudinary for optimized image loading -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!-- JSON-LD: the single business entity for the whole site (pages reference it by @id) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Bakery",
      "@id": "https://www.odette-confiserie.ro/#bakery",
      "name": "Odette Confiserie",
      "legalName": "Olala Sweets SRL",
      "url": "https://www.odette-confiserie.ro/",
      "logo": "https://www.odette-confiserie.ro/logo_swan.png",
      "image": "https://www.odette-confiserie.ro/og-image.jpg",
      "telephone": "+40756157067",
      "email": "odette.confiserie@gmail.com",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Strada Câmpului 133",
        "addressLocality": "Cluj-Napoca",
        "addressRegion": "Cluj",
        "postalCode": "400686",
        "addressCountry": "RO"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 46.752273,
        "longitude": 23.565352
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday"
          ],
          "opens": "09:00",
          "closes": "19:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Saturday",
          "opens": "08:00",
          "closes": "12:00"
        }
      ],
      "sameAs": [
        "https://www.instagram.com/odette.confiserie/",
        "https://www.facebook.com/profile.php?id=61581913980330"
      ]
    }
    </script>
  </head>
  <body>
    <noscript>Trebuie să activați JavaScript pentru a rula această aplicație.</noscript>
    <div id="root"></div>
    <!-- Load manifest after page to avoid blocking critical path -->
    <script>
      window.addEventListener('load', function() {
        var link = document.createElement('link');
        link.rel = 'manifest';
        link.href = '%PUBLIC_URL%/manifest.json';
        document.head.appendChild(link);
      });
    </script>
  </body>
</html>
